<!-- Advanced JavaScript Functions Implementation -->
<script>
/* ===== 1. CLOSURE - Product Filter with Private State ===== */
// Closure to encapsulate product filter state
const createProductFilter = (() => {
    // Private variables (closure scope)
    let productData = [
        { name: 'Laptop', category: 'laptop', price: 59999 },
        { name: 'Smartphone', category: 'smartphone', price: 24999 },
        { name: 'Smartwatch', category: 'smartwatch', price: 39999 },
        { name: 'Tablet', category: 'tablet', price: 49999 }
    ];
    let currentFilter = 'all';
    
    // Private function to filter products
    const filterByCategory = (category) => {
        if (category === 'all') return productData;
        return productData.filter(item => item.category === category);
    };
    
    // Private arrow function to calculate total
    const calculateTotal = (...prices) => prices.reduce((sum, price) => sum + price, 0);
    
    // Return public methods using closure
    return {
        getFilteredProducts: (category) => filterByCategory(category),
        getAllPrices: () => productData.map(p => p.price),
        getTotalPrice: () => calculateTotal(...productData.map(p => p.price)),
        getAveragePrice: (prices = productData.map(p => p.price)) => {
            // Default parameter usage
            return calculateTotal(...prices) / prices.length;
        },
        getMinMax: (...prices) => {
            // Rest parameters
            return {
                min: Math.min(...prices),
                max: Math.max(...prices)
            };
        }
    };
})();

// Arrow function for filtering products
const filterProducts = (category) => {
    // Update button states using arrow function
    const buttons = document.querySelectorAll('.filter-btn');
    buttons.forEach(btn => {
        btn.classList.remove('active');
        if (btn.textContent.toLowerCase().includes(category) || 
            (category === 'all' && btn.textContent === 'All')) {
            btn.classList.add('active');
        }
    });
    
    // Show category message
    const cards = document.querySelectorAll('.card');
    cards.forEach(card => {
        const h3 = card.querySelector('h3');
        const productName = h3.textContent.toLowerCase();
        const categoryMatch = category === 'all' || productName.includes(category);
        card.style.display = categoryMatch ? 'block' : 'none';
    });
    
    // Clear stats
    document.getElementById('priceStats').textContent = '';
};

// Arrow function for price statistics
const showPriceStats = () => {
    const statsDiv = document.getElementById('priceStats');
    const prices = createProductFilter.getAllPrices();
    const minMax = createProductFilter.getMinMax(...prices);
    const avg = createProductFilter.getAveragePrice();
    
    statsDiv.innerHTML = `
        Average Price: ₹${avg.toFixed(2)}<br>
        Min Price: ₹${minMax.min}<br>
        Max Price: ₹${minMax.max}<br>
        Total: ₹${createProductFilter.getTotalPrice()}
    `;
    
    // Highlight active button
    const buttons = document.querySelectorAll('.filter-btn');
    buttons.forEach(btn => btn.classList.remove('active'));
    buttons[buttons.length - 1].classList.add('active');
};

/* ===== 2. ARROW FUNCTIONS - Price Display ===== */
// Using arrow function for cleaner syntax
const formatPrice = (price) => `₹${price.toLocaleString('en-IN')}`;
const calculateDiscount = (price, discountPercent = 10) => {
    // Default parameter
    return price - (price * discountPercent / 100);
};

/* ===== 3. SPREAD OPERATOR - Product Data ===== */
// Using spread to combine product arrays
const basicProducts = ['Laptop', 'Smartphone'];
const accessoryProducts = ['Headphones', 'Charger'];
const allProducts = [...basicProducts, ...accessoryProducts]; // Spread operator

console.log('All Products:', allProducts);
</script>
